services:
  dashboard:
    build: .
    image: dashboard:local
    container_name: dashboard
    network_mode: host
    user: "1000:1000"
    environment:
      HOST: 0.0.0.0
      PORT: 4200
      DB_PATH: /app/data/dashboard.sqlite
      PROC_PATH: /host/proc
      LOG_PATH: /host/log
      DOCKER_SOCKET: /var/run/docker.sock
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200,http://192.168.1.6:4200,http://100.75.217.127:4200,http://localhost:5173,http://127.0.0.1:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_DIR: /app/frontend/build
    volumes:
      - ./data:/app/data
      - /proc:/host/proc:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/host/log:ro
      - /var/run/fail2ban:/var/run/fail2ban:ro
    restart: unless-stopped
    develop:
      watch:
        - path: ./cmd
          action: rebuild
        - path: ./internal
          action: rebuild
        - path: ./frontend
          action: rebuild
