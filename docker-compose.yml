services:
  dashboard:
    build: .
    image: dashboard:local
    container_name: dashboard
    network_mode: host
    environment:
      HOST: 0.0.0.0
      PORT: 4200
      DB_PATH: /app/data/dashboard.sqlite
      PROC_PATH: /host/proc
      LOG_PATH: /host/log
      DOCKER_SOCKET: /var/run/docker.sock
      CRON_PATHS: ${CRON_PATHS:-/host/etc/crontab,/host/etc/cron.d/*,/app/data/cron-user-spool/*}
      JOURNAL_GROUP_PATHS: /run/log/journal,/var/log/journal
      CRON_SPOOL_SOURCE_DIRS: /host/var/spool/cron,/host/var/spool/cron/crontabs,/host/var/spool/cron/tabs
      CRON_SPOOL_CACHE_DIR: /app/data/cron-user-spool
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200,http://localhost:5173,http://127.0.0.1:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      PUBLIC_DIR: /app/frontend/build
    volumes:
      - ./data:/app/data
      - /etc/crontab:/host/etc/crontab:ro
      - /etc/cron.d:/host/etc/cron.d:ro
      - /var/spool/cron:/host/var/spool/cron:ro
      - /proc:/host/proc:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/log/journal:/run/log/journal:ro
      - /var/log/journal:/var/log/journal:ro
      - /var/log:/host/log:ro
      - /var/run/fail2ban:/var/run/fail2ban:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4200/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    develop:
      watch:
        - path: ./cmd
          action: rebuild
        - path: ./internal
          action: rebuild
        - path: ./frontend
          action: rebuild
