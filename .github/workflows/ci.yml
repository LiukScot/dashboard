name: CI

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  go-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Vet backend
        run: go vet ./...

      - name: Run Go tests
        run: go test ./...

      - name: Build backend
        run: go build ./...

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1"

      - name: Cache Bun dependencies
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.bun/install/cache
            frontend/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/package.json', 'frontend/bun.lockb', 'frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install

      - name: Build frontend
        run: bun run build

  component-frontend:
    name: Component (frontend vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1"

      - name: Install frontend dependencies
        run: bun install

      - name: Run vitest
        run: bun run test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1"

      - name: Install root deps
        run: bun install

      - name: Build frontend
        run: bun run smoke:build:fe

      - name: Build Go binary
        run: bun run smoke:build:go

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: bunx playwright test

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build container image
        run: docker build -t dashboard:ci .

      # Boot the real image and assert /healthz responds. A "docker build .\"
      # check alone misses runtime regressions (missing modules, panics during
      # migrate, broken entrypoint, dangling symlinks from a leaky
      # .dockerignore, etc.) — those only surface when the binary actually
      # runs. Mirror of the notes repo guard added after a silent crash-loop
      # made it to production.
      - name: Boot container
        run: |
          docker run -d --name dashboard-smoke -p 4200:4200 dashboard:ci

      - name: Wait for /healthz (max 30s)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4200/healthz | grep -q '"status":"ok"'; then
              echo "healthz OK after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::/healthz never responded; container logs:"
          docker logs dashboard-smoke || true
          exit 1

      - name: Assert no fatal errors in logs
        run: |
          if docker logs dashboard-smoke 2>&1 | grep -E 'panic:|fatal error:|runtime error:|cannot find|undefined symbol'; then
            echo "::error::container logged a fatal error during boot"
            docker logs dashboard-smoke
            exit 1
          fi

      - name: Stop container
        if: always()
        run: docker rm -f dashboard-smoke || true
