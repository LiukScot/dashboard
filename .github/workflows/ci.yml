name: CI

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  go-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Vet backend
        run: go vet ./...

      - name: Run Go tests
        run: go test ./...

      - name: Build backend
        run: go build ./...

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            frontend/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/package.json', 'frontend/bun.lockb', 'frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install

      - name: Build frontend
        run: bun run build

  app-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install

      - name: Build frontend
        working-directory: frontend
        run: bun run build

      - name: Start dashboard
        env:
          HOST: 127.0.0.1
          PORT: 4200
          DB_PATH: ${{ runner.temp }}/dashboard.sqlite
          PUBLIC_DIR: ${{ github.workspace }}/frontend/build
        run: |
          go run ./cmd/dashboard >"$RUNNER_TEMP/dashboard.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/dashboard.pid"

      - name: Smoke test app
        run: |
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4200/api/v1/auth/session >/tmp/session.json; then
              break
            fi
            sleep 1
          done

          curl --fail --show-error --silent http://127.0.0.1:4200/ >/tmp/index.html
          grep -q '"authenticated":false' /tmp/session.json
          grep -q '<!doctype html>' /tmp/index.html

      - name: Show app log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/dashboard.log"

      - name: Stop dashboard
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/dashboard.pid")" || true

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build .
